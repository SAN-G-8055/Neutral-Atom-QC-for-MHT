[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutral-atom-mht"
version = "0.1.0"
description = "Interpretable cell detection and neutral-atom multiple-hypothesis tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "Pillow>=11.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
quantum = ["qutip>=5.1,<6"]
notebook = ["ipykernel>=6", "jupyterlab>=4"]
test = ["ipykernel>=6", "nbclient>=0.10", "nbformat>=5.10", "pytest>=8.0"]

[project.scripts]
cell-detect = "neutral_atom_mht.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "quantum: executes the optional QuTiP state-vector simulator",
]
