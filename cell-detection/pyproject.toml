[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-detection-pipeline"
version = "0.1.0"
description = "Fast phase-contrast cell segmentation and centroid extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "Pillow>=11.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cell-detect = "cell_detection_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
